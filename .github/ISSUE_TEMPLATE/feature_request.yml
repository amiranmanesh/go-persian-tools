name: Feature request
description: Suggest a utility to add
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the task in your own application, not the function you have in mind.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: What the function would look like
      render: go
      value: |
        // Doc comment.
        func Name(text string) string

        persian.Name("...") // => "..."

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Existing functions in this package, another library, or hand-written code.
