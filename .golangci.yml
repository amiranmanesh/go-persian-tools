version: "2"

linters:
  default: standard
  enable:
    - copyloopvar
    - misspell
    - revive
    - unconvert
    - usestdlibvars
    - whitespace
  settings:
    misspell:
      locale: US
      # "teh marbuta" is the Unicode name of ة, not a typo for "the".
      ignore-rules:
        - teh
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
